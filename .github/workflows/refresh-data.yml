name: Refresh stats

on:
  schedule:
    # 10:15 UTC = early morning in Toronto, after West Coast games finish
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and compute stats
        run: node scripts/fetch-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data; then
            echo "No changes"
            exit 0
          fi
          git config user.name "thatsball-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh stats $(date -u +%Y-%m-%d)"
          git push

name: Accessibility check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the checker
        run: npm i --no-save playwright@1 @axe-core/playwright@4 && npx playwright install --with-deps chromium
      - name: Run axe on every page
        run: node .github/a11y/check.mjs
